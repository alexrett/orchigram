apiVersion: orchigram.dev/v1alpha1
kind: Flow
metadata:
  name: github-issue-to-pr
  labels:
    orchigram.dev/example: github-sdlc
spec:
  inputSchema:
    type: object
    properties:
      repository:
        type: object
        properties:
          owner: {type: string}
          name: {type: string}
        required: [owner, name]
        additionalProperties: false
      issue:
        type: object
        properties:
          number: {type: integer}
          title: {type: string}
          body: {type: string}
          html_url: {type: string}
          state: {type: string}
        required: [number, title, body, html_url, state]
        additionalProperties: false
    required: [repository, issue]
    additionalProperties: false
  policies:
    timeout: 336h
    maxParallel: 1
  nodes:
    - id: fetch_issue
      name: Fetch current issue
      uses: github.issue.get
      with:
        owner: alexrett
        repository: orchigram-e2e
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        number: 1
        mappings:
          - {from: input.issue.number, to: /number}
    - id: checkout
      name: Create isolated issue branch
      uses: github.workspace.checkout
      timeout: 5m
      with:
        repositoryRef: orchigram-e2e
        issueNumber: 1
        mappings:
          - {from: nodes.fetch_issue.issue.number, to: /issueNumber}
    - id: plan
      name: Plan read-only change
      uses: agent-command.run
      timeout: 20m
      with:
        profile: github-planner
        workspace: .
        prompt: |-
          Inspect the repository and prepare a concrete implementation plan for
          GitHub issue #${nodes.fetch_issue.issue.number}: ${nodes.fetch_issue.issue.title}

          ${nodes.fetch_issue.issue.body}

          Do not modify files. Return only the plan as Markdown.
        mappings:
          - {from: nodes.checkout.workspace, to: /workspace}
    - id: publish_plan
      name: Publish reconciled plan comment
      uses: github.issue.comment
      with:
        owner: alexrett
        repository: orchigram-e2e
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        number: 1
        body: |-
          ## Orchigram implementation plan

          ${nodes.plan.text}
        mappings:
          - {from: nodes.fetch_issue.issue.number, to: /number}
    - id: approval
      name: Approve implementation
      uses: core.approval
      timeout: 24h
    - id: implement
      name: Implement in workspace
      uses: agent-command.run
      timeout: 45m
      with:
        profile: github-implementer
        workspace: .
        prompt: |-
          Implement GitHub issue #${nodes.fetch_issue.issue.number}: ${nodes.fetch_issue.issue.title}

          Follow this approved plan:
          ${nodes.plan.text}

          Work only in the supplied repository workspace. Do not commit, push,
          create a pull request, or modify credentials.
        mappings:
          - {from: nodes.checkout.workspace, to: /workspace}
    - id: tests
      name: Run configured test gate
      uses: exec.run
      timeout: 20m
      with:
        argv: [go, test, ./...]
        directory: .
        mappings:
          - {from: nodes.checkout.workspace, to: /directory}
    - id: push
      name: Commit and push deterministic branch
      uses: github.workspace.commit-push
      timeout: 5m
      with:
        workspace: .
        branch: orchigram/issue-1-placeholder
        message: "Implement issue #${nodes.fetch_issue.issue.number}"
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        mappings:
          - {from: nodes.checkout.workspace, to: /workspace}
          - {from: nodes.checkout.branch, to: /branch}
    - id: create_pr
      name: Create or reconcile pull request
      uses: github.pr.ensure
      with:
        owner: alexrett
        repository: orchigram-e2e
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        head: orchigram/issue-1-placeholder
        base: main
        title: "Orchigram: ${nodes.fetch_issue.issue.title}"
        body: |-
          Implements #${nodes.fetch_issue.issue.number}.

          Plan and execution are recorded by Orchigram. This pull request is
          never merged automatically.
        mappings:
          - {from: nodes.checkout.branch, to: /head}
    - id: final_status
      name: Publish merge-ready issue status
      uses: github.issue.comment
      with:
        owner: alexrett
        repository: orchigram-e2e
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        number: 1
        body: |-
          Orchigram verified current-head approval and the configured GitHub
          checks for PR ${nodes.create_pr.url}. It is merge-ready, but Orchigram
          has not merged it; a human owns the final merge decision.
        mappings:
          - {from: nodes.fetch_issue.issue.number, to: /number}
    - id: wait_review
      name: Wait for submitted pull-request review
      uses: core.event
      timeout: 168h
      loop: {maxIterations: 8}
    - id: rework
      name: Address requested review changes
      uses: agent-command.run
      timeout: 45m
      with:
        profile: github-implementer
        workspace: .
        prompt: |-
          Address the GitHub review for issue #${nodes.fetch_issue.issue.number}.

          Review state: ${nodes.wait_review.review.state}
          Reviewer: ${nodes.wait_review.review.author}
          Review body:
          ${nodes.wait_review.review.body}

          Inline comments as JSON:
          ${nodes.wait_review.review.comments}

          Modify only the supplied workspace. Do not commit, push, merge,
          change credentials, or bypass tests.
        mappings:
          - {from: nodes.checkout.workspace, to: /workspace}
    - id: retest
      name: Rerun configured test gate
      uses: exec.run
      timeout: 20m
      with:
        argv: [go, test, ./...]
        directory: .
        mappings:
          - {from: nodes.checkout.workspace, to: /directory}
    - id: repush
      name: Push reviewed changes to the same branch
      uses: github.workspace.commit-push
      timeout: 5m
      with:
        workspace: .
        branch: orchigram/issue-1-placeholder
        message: "Address review ${nodes.wait_review.review.id} for issue #${nodes.fetch_issue.issue.number}"
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        mappings:
          - {from: nodes.checkout.workspace, to: /workspace}
          - {from: nodes.checkout.branch, to: /branch}
    - id: wait_checks
      name: Wait for current-head GitHub checks
      uses: github.commit.checks.wait
      timeout: 60m
      with:
        owner: alexrett
        repository: orchigram-e2e
        tokenSecret: token
        secretRefs: {token: github-e2e-token}
        ref: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        pullNumber: 1
        required: [test]
        pollInterval: 10s
        mappings:
          - {from: nodes.wait_review.pull.head_sha, to: /ref}
          - {from: nodes.create_pr.number, to: /pullNumber}
  edges:
    - {from: fetch_issue, to: checkout}
    - {from: checkout, to: plan}
    - {from: plan, to: publish_plan}
    - {from: publish_plan, to: approval}
    - {from: approval, to: implement, when: result.approved}
    - {from: implement, to: tests}
    - {from: tests, to: push}
    - {from: push, to: create_pr}
    - {from: create_pr, to: wait_review}
    - {from: wait_review, to: rework, when: 'result.review.state == "CHANGES_REQUESTED" && result.review.commit_id == result.pull.head_sha'}
    - {from: rework, to: retest}
    - {from: retest, to: repush}
    - {from: repush, to: wait_review}
    - {from: wait_review, to: wait_review, when: 'result.review.state == "CHANGES_REQUESTED" && result.review.commit_id != result.pull.head_sha'}
    - {from: wait_review, to: wait_review, when: 'result.review.state == "APPROVED" && result.review.commit_id != result.pull.head_sha'}
    - {from: wait_review, to: wait_checks, when: 'result.review.state == "APPROVED" && result.review.commit_id == result.pull.head_sha'}
    - {from: wait_checks, to: wait_review, when: 'result.state == "stale"'}
    - {from: wait_checks, to: final_status, when: 'result.state == "success"'}
