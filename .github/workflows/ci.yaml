name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.61.0"
      - uses: arduino/setup-protoc@v3
        with:
          version: "33.4"
      - run: make check
      - run: make cross-build

