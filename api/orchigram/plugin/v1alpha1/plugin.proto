syntax = "proto3";

package orchigram.plugin.v1alpha1;

option go_package = "github.com/alexrett/orchigram/gen/orchigram/plugin/v1alpha1;pluginv1alpha1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message CallMeta {
  string request_id = 1;
  string run_uid = 2;
  string node_id = 3;
  uint32 attempt = 4;
  string idempotency_key = 5;
  google.protobuf.Timestamp deadline = 6;
}
message ProtocolRange { uint32 minimum = 1; uint32 maximum = 2; }
message DescribeRequest { ProtocolRange host_protocol = 1; }
message ActionDescriptor {
  string action = 1;
  bytes config_schema_json = 2;
  bytes input_schema_json = 3;
  bytes output_schema_json = 4;
}
message TriggerDescriptor {
  string source = 1;
  bytes config_schema_json = 2;
  bytes event_schema_json = 3;
}
message DescribeResponse {
  string name = 1;
  string version = 2;
  ProtocolRange protocol = 3;
  repeated string capabilities = 4;
  bytes input_schema_json = 5 [deprecated = true];
  bytes output_schema_json = 6 [deprecated = true];
  repeated ActionDescriptor actions = 7;
  repeated TriggerDescriptor triggers = 8;
}
message HealthResponse { bool ready = 1; string message = 2; }
message ShutdownRequest { google.protobuf.Timestamp deadline = 1; }

message ValidateActionRequest { string action = 1; bytes config_json = 2; }
message ValidationIssue { string path = 1; string code = 2; string message = 3; }
message ValidateActionResponse { repeated ValidationIssue issues = 1; }
message ExecuteRequest { CallMeta meta = 1; string action = 2; bytes input_json = 3; bytes config_json = 4; map<string, bytes> secrets = 5; }
message ExecuteEvent {
  uint64 sequence = 1;
  string type = 2;
  bytes payload_json = 3;
  bytes raw_log = 4;
  google.protobuf.Timestamp occurred_at = 5;
}
message CancelRequest { CallMeta meta = 1; string reason = 2; }
message CancelResponse { bool accepted = 1; string outcome = 2; }

message WatchStart {
  string installation_uid = 1;
  string cursor = 2;
  bytes config_json = 3;
  map<string, bytes> secrets = 4;
  google.protobuf.Timestamp activated_at = 5;
}
message TriggerAck { string provider_event_id = 1; string cursor = 2; }
message TriggerCommand { oneof value { WatchStart start = 1; TriggerAck ack = 2; } }
message TriggerEvent {
  string provider_event_id = 1;
  string cursor = 2;
  google.protobuf.Timestamp occurred_at = 3;
  bytes payload_json = 4;
  // target_run_uid is required only when the Trigger opts into signal delivery.
  string target_run_uid = 5;
}

message AgentRequest { CallMeta meta = 1; string profile_type = 2; bytes profile_json = 3; bytes input_json = 4; map<string, bytes> secrets = 5; }
message AgentInput { CallMeta meta = 1; bytes payload_json = 2; }

service PluginControl {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Health(google.protobuf.Empty) returns (HealthResponse);
  rpc Shutdown(ShutdownRequest) returns (google.protobuf.Empty);
}
service TaskProvider {
  rpc ValidateAction(ValidateActionRequest) returns (ValidateActionResponse);
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
}
service TriggerProvider {
  rpc Watch(stream TriggerCommand) returns (stream TriggerEvent);
}
service AgentRuntime {
  rpc Execute(AgentRequest) returns (stream ExecuteEvent);
  rpc Input(AgentInput) returns (google.protobuf.Empty);
  rpc Cancel(CancelRequest) returns (CancelResponse);
}
