version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
  except:
    # The public contract intentionally uses reusable envelope messages and the
    # user-facing plugin capability names defined in the architecture.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
